# Socralearner 러너 → GitHub Action 스키마
#
# ChatGPT → GPT 편집 → Actions → Schema 칸에 이 파일 내용을 **그대로 붙여넣는다**.
# 인증: Authentication = API Key / Auth Type = Bearer / 값 = 아래 권한의 fine-grained PAT.
#
# PAT 권한 (자기 학습 repo 하나만 선택):
#   - Contents: Read-only        ← STATUS·daily 읽기
#   - Issues:   Read and write   ← 세션 기록 쓰기
#   ※ Contents write는 필요 없다. 파일을 만드는 것은 모델이 아니라 CI다.
#     이유: Contents API는 파일 본문 전체를 base64 한 덩어리로 요구해서, 노트가
#     길어지면 인코딩이 깨지고 커밋이 실패한다(모델이 "3줄 요약"으로 스스로 줄어든다).
#     그래서 모델은 평문만 쓰고, 파일 생성은 결정론적 CI가 맡는다.
#
# 쓰기 프로토콜:
#   ① createNote 로 Issue 생성 (제목: `[학습] YYYY-MM-DD <slug> — <한 줄 제목>`)
#   ② 길면 appendNote 로 이어 쓴다 (한 번에 ~40줄, 절 단위로 끊는다)
#   ③ closeNote 로 종료 → CI가 daily/ 에 파일을 만들고 결과를 그 Issue에 코멘트로 회신

openapi: 3.1.0
info:
  title: Socralearner 학습 러너 API
  description: 학습 세션의 읽기(Contents 평문)와 쓰기(Issue 평문) 경로.
  version: 1.0.0
servers:
  - url: https://api.github.com

paths:
  /repos/{owner}/{repo}/contents/{path}:
    get:
      operationId: readFile
      summary: repo 파일을 평문으로 읽는다 (STATUS.md, daily/*.md, mastery.md 등)
      description: >-
        Accept 헤더를 application/vnd.github.raw 로 보내면 base64가 아니라 평문이 온다.
        base64 응답은 모델이 디코딩할 수 없으므로 이 헤더는 항상 보낸다.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo,  in: path, required: true, schema: { type: string } }
        - name: path
          in: path
          required: true
          description: "repo 루트 기준 경로. 예: STATUS.md"
          schema: { type: string }
        - name: Accept
          in: header
          required: true
          schema:
            type: string
            enum: ["application/vnd.github.raw"]
            default: "application/vnd.github.raw"
      responses:
        "200":
          description: 파일 평문
          content:
            text/plain:
              schema: { type: string }

  /repos/{owner}/{repo}/issues:
    post:
      operationId: createNote
      summary: 학습 세션 기록을 시작한다 (Issue 생성 — 평문, base64 없음)
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo,  in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title:
                  type: string
                  description: "`[학습] YYYY-MM-DD <slug> — <한 줄 제목>` (반드시 [학습]으로 시작)"
                body:
                  type: string
                  description: "세션 노트 본문(마크다운 평문). 길면 나눠서 appendNote로 이어 쓴다."
      responses:
        "201":
          description: 생성된 Issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  number: { type: integer }
                  html_url: { type: string }

  /repos/{owner}/{repo}/issues/{issue_number}/comments:
    post:
      operationId: appendNote
      summary: 앞서 만든 Issue에 노트를 이어 쓴다 (긴 세션용)
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo,  in: path, required: true, schema: { type: string } }
        - { name: issue_number, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, description: "이어지는 절(마크다운 평문)" }
      responses:
        "201": { description: 코멘트 생성됨 }

  /repos/{owner}/{repo}/issues/{issue_number}:
    patch:
      operationId: closeNote
      summary: Issue를 닫아 기록을 확정한다 → CI가 daily/ 파일을 만든다
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo,  in: path, required: true, schema: { type: string } }
        - { name: issue_number, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { type: string, enum: [closed], default: closed }
      responses:
        "200": { description: 닫힘 — 잠시 뒤 CI 결과가 그 Issue에 코멘트로 달린다 }
